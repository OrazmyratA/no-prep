name: Release — Electron (Windows)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create GitHub Release and upload assets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Encrypt premium features
        run: node scripts/encrypt-features.js

      # Google Drive backup's desktop OAuth client (docs/google-drive-backup-setup.md). Without the
      # secrets the file is not written and the app shows no backup option.
      - name: Google Drive backup client
        shell: bash
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_DESKTOP_CLIENT_ID" ] && [ -n "$GOOGLE_DESKTOP_CLIENT_SECRET" ]; then
            node -e "require('fs').writeFileSync('electron/main/google-oauth.local.json', JSON.stringify({ clientId: process.env.GOOGLE_DESKTOP_CLIENT_ID, clientSecret: process.env.GOOGLE_DESKTOP_CLIENT_SECRET }))"
            echo "Google Drive backup: on"
          else
            echo "Google Drive backup: off (no secrets)"
          fi

      - name: Angular production build
        run: npm run build:prod

      # No publishing here: when the Android job made the release first, electron-builder put
      # latest.yml into a second draft release that the upload step below then deleted, and
      # installed apps never saw v1.19.1. All files go up in one step instead.
      - name: Package with electron-builder
        run: npx electron-builder --win --publish never

      # package.json build.files leaves renderer/Android packages out; make sure the main process
      # still finds everything it loads (see docs/production-release-checklist.md).
      - name: Check packaged main-process modules
        shell: bash
        run: ELECTRON_RUN_AS_NODE=1 release/win-unpacked/No-Prep.exe scripts/check-packaged-app.cjs release/win-unpacked/resources

      # latest.yml is what installed apps read to find an update; the blockmap lets them download
      # only the changed parts.
      - name: Upload installer and update files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
