name: Release — Electron (Windows)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create GitHub Release and upload assets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Encrypt premium features
        run: node scripts/encrypt-features.js

      - name: Angular production build
        run: npm run build:prod

      - name: Package with electron-builder
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # package.json build.files leaves renderer/Android packages out; make sure the main process
      # still finds everything it loads (see docs/production-release-checklist.md).
      - name: Check packaged main-process modules
        shell: bash
        run: ELECTRON_RUN_AS_NODE=1 release/win-unpacked/No-Prep.exe scripts/check-packaged-app.cjs release/win-unpacked/resources

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
