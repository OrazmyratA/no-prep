name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # onnxruntime-node (offline subtitle engine, not packed into the app) would download a CUDA
      # GPU build on Linux, and that download now answers 404 and fails the whole install.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Production build
        run: npm run build:prod
