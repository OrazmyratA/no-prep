name: Release — Android AAB + APK

on:
  push:
    tags:
      - 'v*'
  # Rebuild a release that already exists (e.g. after a CI fix): pick its tag, the AAB is added to it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v1.18.0'
        required: true

jobs:
  build-android:
    name: Build signed Android AAB and APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - run: npm ci

      - name: Angular production build + Capacitor sync
        run: npm run android:sync

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/noprep-release.jks

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties << PROPS
          storeFile=noprep-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Build release AAB and APK
        # gradle.properties names the developer's Windows JDK; here the runner's JDK 21 is used.
        # The AAB is for the Play Console; the APK is what the Download page and the in-app
        # updater hand to phones (they look for a .apk asset and fall back to the release page).
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties
          cd android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease

      - name: Name the APK after the version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "android/No-Prep-${TAG#v}.apk"

      - name: Upload AAB and APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/No-Prep-*.apk
          generate_release_notes: true
