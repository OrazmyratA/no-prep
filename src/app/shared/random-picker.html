<button
  #fabButton
  type="button"
  class="rp-fab"
  [class.rp-fab-positioned]="fabPosition"
  [class.rp-fab-dragging]="dragging"
  [style.left.px]="fabPosition?.left"
  [style.top.px]="fabPosition?.top"
  (pointerdown)="onFabPointerDown($event)"
  (pointermove)="onFabPointerMove($event)"
  (pointerup)="onFabPointerUp($event)"
  (pointercancel)="onFabPointerCancel($event)"
  (click)="onFabClick()"
  [attr.title]="'randomPickerTrigger' | translate"
  [attr.aria-label]="'randomPickerTrigger' | translate">
  <img src="assets/images/randomize.png" alt="" aria-hidden="true" draggable="false">
</button>

<div class="rp-backdrop" *ngIf="overlayOpen" (click)="closeOverlay($event)">
  <div class="rp-panel" role="dialog" aria-modal="true" (click)="stopPropagation($event)">
    <button
      type="button"
      class="rp-close"
      (click)="closeOverlay()"
      [attr.aria-label]="'randomPickerClose' | translate">
      ✕
    </button>

    <ng-container *ngIf="selectedTopicId == null; else lbBoard">
      <div class="lb-empty-state">
        <h2 class="rp-title">{{ 'leaderboardChooseListTitle' | translate }}</h2>
        <p class="lb-empty-message">{{ 'leaderboardChooseListMessage' | translate }}</p>
        <button type="button" class="lb-choose-list-btn" (click)="chooseList()">
          {{ 'leaderboardChooseListButton' | translate }}
        </button>
      </div>
    </ng-container>

    <ng-template #lbBoard>
      <div class="lb-header">
        <div class="lb-header-title-group">
          <button
            type="button"
            class="lb-list-title-icon-btn"
            [class.active]="rankingApplied"
            [disabled]="dragActive"
            (click)="toggleRanking()"
            [attr.title]="(rankingApplied ? 'leaderboardRestoreOrder' : 'leaderboardCommitReorder') | translate"
            [attr.aria-label]="(rankingApplied ? 'leaderboardRestoreOrder' : 'leaderboardCommitReorder') | translate">
            <img
              src="assets/images/ranking.png"
              class="lb-list-title-icon"
              alt="">
          </button>
          <h2 class="rp-title lb-header-title">{{ selectedTopicName }}</h2>
        </div>
        <div class="lb-header-actions">
          <app-leaderboard-hammer (hit)="onHammerHit($event)"></app-leaderboard-hammer>

          <button
            type="button"
            class="lb-header-btn lb-icon-btn lb-icon-btn-img"
            [class.active]="mode === 'individual'"
            [attr.aria-pressed]="mode === 'individual'"
            (click)="setMode('individual')"
            [attr.title]="'leaderboardModeIndividual' | translate"
            [attr.aria-label]="'leaderboardModeIndividual' | translate">
            <img src="assets/images/individual.png" alt="" aria-hidden="true">
          </button>
          <button
            type="button"
            class="lb-header-btn lb-icon-btn lb-icon-btn-img"
            [class.active]="mode === 'team'"
            [attr.aria-pressed]="mode === 'team'"
            (click)="setMode('team')"
            [attr.title]="'leaderboardModeTeam' | translate"
            [attr.aria-label]="'leaderboardModeTeam' | translate">
            <img src="assets/images/teamwork.png" alt="" aria-hidden="true">
          </button>

          <button
            type="button"
            class="lb-header-btn lb-icon-btn lb-icon-btn-img"
            [class.active]="showWheel"
            [attr.aria-pressed]="showWheel"
            (click)="toggleWheel()"
            [attr.title]="'leaderboardWheelToggle' | translate"
            [attr.aria-label]="'leaderboardWheelToggle' | translate">
            <img src="assets/images/fortune-wheel.png" alt="" aria-hidden="true">
          </button>

          <button
            type="button"
            class="lb-header-btn lb-icon-btn lb-icon-btn-img lb-grid-btn"
            (click)="cycleGridColumns()"
            [attr.title]="'leaderboardGridColumns' | translate"
            [attr.aria-label]="'leaderboardGridColumns' | translate">
            <img src="assets/images/grid.png" alt="" aria-hidden="true">
            <span class="lb-grid-count-badge" aria-hidden="true">{{ gridColumns }}</span>
          </button>

          <button
            *ngIf="mode === 'team'"
            type="button"
            class="lb-header-btn lb-icon-btn"
            (click)="openTeamSetup()"
            [attr.title]="'leaderboardTeamManage' | translate"
            [attr.aria-label]="'leaderboardTeamManage' | translate">
            <span aria-hidden="true">✏️</span>
          </button>
          <button
            type="button"
            class="lb-header-btn lb-icon-btn lb-icon-btn-img"
            [class.active]="sessionActive"
            (click)="toggleScoreSession()"
            [attr.title]="(sessionActive ? 'leaderboardSessionEnd' : 'leaderboardSessionStart') | translate"
            [attr.aria-label]="(sessionActive ? 'leaderboardSessionEnd' : 'leaderboardSessionStart') | translate">
            <img src="assets/images/today.png" alt="" aria-hidden="true">
          </button>
          <button
            type="button"
            class="lb-header-btn lb-icon-btn"
            (click)="resetScores()"
            [attr.title]="'leaderboardResetScores' | translate"
            [attr.aria-label]="'leaderboardResetScores' | translate">
            <span aria-hidden="true">🔄</span>
          </button>
          <button
            type="button"
            class="lb-header-btn lb-header-btn-primary lb-icon-btn"
            (click)="chooseList()"
            [attr.title]="'leaderboardChangeList' | translate"
            [attr.aria-label]="'leaderboardChangeList' | translate">
            <span aria-hidden="true">📋</span>
          </button>
        </div>
      </div>

      <ng-container *ngIf="showTeamSetup; else lbSplit">
        <app-leaderboard-team-setup
          [roster]="roster"
          [teams]="teams"
          (done)="onTeamsSetupDone($event)"
          (cancelled)="onTeamsSetupCancelled()">
        </app-leaderboard-team-setup>
      </ng-container>

      <ng-template #lbSplit>
        <div class="lb-split" [class.lb-split-wheel-open]="showWheel">
          <app-leaderboard-ranking-list
            class="lb-split-list"
            [columnBuckets]="activeColumns"
            [rankByItemId]="rankByItemId"
            [rankingApplied]="rankingApplied"
            [rankedUpItemIds]="rankedUpItemIds"
            [hammerHitItemId]="hammerHitItemId"
            (starClick)="onStarClick($event)"
            (addStudent)="addStudent()"
            (toggleAbsent)="toggleAbsent($event)"
            (columnsChange)="onColumnsChange($event)"
            (dragActiveChange)="onDragActiveChange($event)">
          </app-leaderboard-ranking-list>

          <div class="lb-split-wheel-wrap" [class.open]="showWheel">
            <app-leaderboard-wheel
              class="lb-split-wheel"
              [entries]="wheelEntries"
              (landed)="onWheelLanded($event)">
            </app-leaderboard-wheel>

            <button
              type="button"
              class="lb-wheel-reset-btn"
              *ngIf="!showReveal"
              (click)="resetWheelPool()"
              [attr.title]="'leaderboardWheelReset' | translate"
              [attr.aria-label]="'leaderboardWheelReset' | translate">
              <span aria-hidden="true">🔁</span> {{ 'leaderboardWheelReset' | translate }}
            </button>

            <div
              class="rp-reveal-overlay"
              *ngIf="showReveal && selectedEntry"
              [class.visible]="revealVisible"
              [style.--team-color]="selectedEntry.color || null">
              <div class="rp-reveal-card" [class.rp-reveal-card-team-colored]="!!selectedEntry.color">
                <img
                  *ngIf="selectedEntry.image"
                  [src]="imageUrl(selectedEntry.image, selectedEntry.itemId)"
                  class="rp-reveal-image">
                <div class="rp-reveal-text" [class.rp-reveal-text-only]="!selectedEntry.image">{{ selectedEntry.text }}</div>
              </div>
              <div class="rp-reveal-actions">
                <button type="button" class="rp-ok-btn" (click)="confirmCorrect()">✓ {{ 'leaderboardCorrect' | translate }}</button>
                <button type="button" class="rp-oops-btn" (click)="confirmOops()">✗ {{ 'leaderboardOops' | translate }}</button>
              </div>
            </div>
          </div>
        </div>
      </ng-template>
    </ng-template>
  </div>
</div>
