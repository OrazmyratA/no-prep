<div appBodyPortal class="fixed inset-0 z-[9600] flex items-center justify-center bg-black/70 p-4">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200">
      <h2 class="text-base font-semibold text-gray-800">{{ 'cropImageTitle' | translate }}</h2>
      <button type="button" (click)="cancel()" class="text-sm text-gray-500 hover:text-gray-700">
        {{ 'cancel' | translate }}
      </button>
    </div>

    <!-- Thumbnails (the current picture, if any, plus every attached page) — only when there's
         more than one source to pick from. -->
    <div *ngIf="images.length > 1" class="flex gap-2 px-4 py-2 overflow-x-auto border-b border-gray-100 bg-gray-50">
      <button *ngFor="let url of thumbUrls; let i = index" type="button"
              (click)="setActiveIndex(i)"
              class="flex-shrink-0 flex flex-col items-center gap-1">
        <span class="rounded border-2 overflow-hidden block"
              [class.border-blue-500]="i === activeIndex"
              [class.border-transparent]="i !== activeIndex">
          <img [src]="url" class="h-14 w-20 object-cover block">
        </span>
        <span *ngIf="labelFor(i)" class="text-xs text-gray-600 max-w-[80px] truncate"
              [class.font-semibold]="i === activeIndex" [class.text-blue-600]="i === activeIndex">
          {{ labelFor(i) }}
        </span>
      </button>
    </div>

    <div class="flex-1 min-h-0 flex items-center justify-center bg-gray-900 p-3 touch-none">
      <div #stage
           class="relative inline-block max-w-full max-h-full overflow-hidden select-none touch-none"
           (pointermove)="onPointerMove($event)"
           (pointerup)="onPointerUp()"
           (pointercancel)="onPointerUp()">
        <img [src]="activeUrl" class="block max-w-full max-h-[60vh] select-none" draggable="false" alt="">
        <div class="absolute border-2 border-white cursor-move"
             style="box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);"
             [style.left.%]="box.x * 100" [style.top.%]="box.y * 100"
             [style.width.%]="box.width * 100" [style.height.%]="box.height * 100"
             (pointerdown)="onHandleDown($event, 'move')">
          <div *ngFor="let handle of handles"
               class="absolute w-4 h-4 bg-white border-2 border-blue-500 rounded-full"
               [class.-left-2]="handle.corner === 'nw' || handle.corner === 'sw'"
               [class.-right-2]="handle.corner === 'ne' || handle.corner === 'se'"
               [class.-top-2]="handle.corner === 'nw' || handle.corner === 'ne'"
               [class.-bottom-2]="handle.corner === 'sw' || handle.corner === 'se'"
               [class.cursor-nwse-resize]="handle.corner === 'nw' || handle.corner === 'se'"
               [class.cursor-nesw-resize]="handle.corner === 'ne' || handle.corner === 'sw'"
               (pointerdown)="onHandleDown($event, handle.mode); $event.stopPropagation()">
          </div>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-gray-200">
      <button type="button" (click)="cancel()"
              class="px-4 py-2 rounded border border-gray-300 text-sm hover:bg-gray-100">
        {{ 'cancel' | translate }}
      </button>
      <button type="button" (click)="confirm()" [disabled]="working"
              class="px-4 py-2 rounded bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-50">
        {{ (working ? 'cropping' : 'useThisCrop') | translate }}
      </button>
    </div>
  </div>
</div>
