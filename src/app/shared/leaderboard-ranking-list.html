<div class="lb-list-rows" [class.lb-two-column]="twoColumn">
  <ng-container *ngFor="let entry of entries; let i = index; trackBy: trackByItemId">
    <app-leaderboard-student-row
      *ngIf="rowKind === 'student'"
      #row
      [entry]="entry"
      [rank]="i + 1"
      [rankedUp]="isRankedUp(entry.itemId)"
      [hammerHit]="hammerHitItemId === entry.itemId"
      (starClick)="starClick.emit($event)">
    </app-leaderboard-student-row>
    <app-leaderboard-team-row
      *ngIf="rowKind === 'team'"
      #row
      [entry]="entry"
      [rank]="i + 1"
      [rankedUp]="isRankedUp(entry.itemId)"
      [hammerHit]="hammerHitItemId === entry.itemId"
      (starClick)="starClick.emit($event)">
    </app-leaderboard-team-row>
  </ng-container>

  <p *ngIf="!entries.length" class="lb-list-empty">{{ 'leaderboardNoItemsInTopic' | translate }}</p>
</div>
