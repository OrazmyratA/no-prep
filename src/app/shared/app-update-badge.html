<ng-container *ngIf="visible">
  <button
    type="button"
    class="app-update-dot"
    [class.is-busy]="phase === 'downloading'"
    (click)="togglePanel($event)"
    [attr.aria-label]="'updateBadgeLabel' | translate"
    [attr.title]="'updateBadgeLabel' | translate">
    <span class="app-update-dot-ping" aria-hidden="true"></span>
  </button>

  <div *ngIf="panelOpen" class="app-update-panel" (click)="$event.stopPropagation()">
    <div class="app-update-panel-title">{{ 'updateAvailableTitle' | translate }}</div>

    <div class="app-update-panel-body" *ngIf="phase === 'available'">
      {{ 'updateAvailableBody' | translate: { version: version } }}
    </div>
    <div class="app-update-panel-body" *ngIf="phase === 'downloading'">
      {{ 'updateDownloadingBody' | translate: { progress: progress } }}
    </div>
    <div class="app-update-panel-body" *ngIf="phase === 'ready'">
      {{ (isWebReady ? 'updateReadyWebBody' : 'updateReadyBody') | translate }}
    </div>

    <div class="app-update-panel-actions">
      <button type="button" class="app-update-later" (click)="dismiss($event)">
        {{ 'updateLaterButton' | translate }}
      </button>
      <button
        type="button"
        class="app-update-now"
        [disabled]="phase === 'downloading'"
        (click)="update($event)">
        {{ 'updateNowButton' | translate }}
      </button>
    </div>
  </div>
</ng-container>
