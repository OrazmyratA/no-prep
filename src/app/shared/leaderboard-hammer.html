<button
  type="button"
  class="lb-hammer"
  [class.lb-hammer-floating]="dragLeft !== null"
  [class.lb-hammer-dragging]="dragging"
  [style.left.px]="dragLeft"
  [style.top.px]="dragTop"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerCancel($event)"
  [attr.title]="'leaderboardHammerHint' | translate"
  [attr.aria-label]="'leaderboardHammerHint' | translate">
  <span aria-hidden="true">🔨</span>
</button>
