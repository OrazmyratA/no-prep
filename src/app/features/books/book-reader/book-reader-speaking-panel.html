<div class="speaking-ai-dock" *ngIf="reader.activeSpeakingElement">
  <div class="speaking-ai-main" *ngIf="reader.isSpeakingAiReady(reader.activeSpeakingElement) || reader.checkingSpeakingRuntime; else speakingAiUnavailable">
    <button
      type="button"
      class="speaking-ai-start"
      (click)="reader.toggleSpeakingConversation()"
      [disabled]="reader.checkingSpeakingRuntime"
      [attr.aria-label]="reader.getSpeakingPrimaryActionLabel()"
      [title]="reader.getSpeakingPrimaryActionLabel()">
      <img [src]="reader.speakingSessionActive ? 'assets/images/book/close.png' : 'assets/images/book/ai start.png'" alt="">
    </button>
    <span class="speaking-ai-spacer" aria-hidden="true"></span>
    <button
      type="button"
      class="speaking-ai-expand"
      (click)="reader.speakingPanelExpanded = !reader.speakingPanelExpanded"
      [attr.aria-label]="reader.speakingPanelExpanded ? 'Hide attempts' : 'Show attempts'">
      <img [src]="reader.speakingPanelExpanded ? 'assets/images/book/hide.png' : 'assets/images/book/show.png'" alt="">
    </button>
  </div>
  <ng-template #speakingAiUnavailable>
    <div class="speaking-ai-missing-pack" *ngIf="!reader.needsSpeakingApiKeySetup()">
      <div>
        <strong>AI Speaking unavailable</strong>
        <span>{{ reader.getSpeakingRuntimeStatusText() }}</span>
      </div>
      <div class="speaking-ai-missing-actions">
        <button type="button" class="speaking-ai-mini" (click)="reader.refreshSpeakingRuntimeStatus()">
          Retry
        </button>
      </div>
    </div>
    <div class="speaking-ai-setup" *ngIf="reader.needsSpeakingApiKeySetup()">
      <div>
        <strong>Set up AI Speaking</strong>
        <span>Get a free Groq API key, then paste it below.</span>
      </div>
      <button type="button" class="speaking-ai-mini" (click)="reader.openGroqApiKeyPage()">
        Get free API key
      </button>
      <div class="speaking-ai-setup-row">
        <input
          type="password"
          class="speaking-ai-setup-input"
          [(ngModel)]="reader.speakingApiKeyDraft"
          placeholder="Paste your Groq API key"
          (keydown.enter)="reader.saveSpeakingApiKey()"
          aria-label="Groq API key">
        <button
          type="button"
          class="speaking-ai-mini"
          [disabled]="reader.savingSpeakingApiKey || !reader.speakingApiKeyDraft.trim()"
          (click)="reader.saveSpeakingApiKey()">
          {{ reader.savingSpeakingApiKey ? 'Saving...' : 'Save' }}
        </button>
      </div>
      <span class="speaking-ai-setup-error" *ngIf="reader.speakingApiKeyError">{{ reader.speakingApiKeyError }}</span>
    </div>
  </ng-template>
  <div class="speaking-ai-attempts" *ngIf="reader.speakingPanelExpanded">
    <ng-container *ngIf="reader.speakingSessionActive; else speakingSessionHistory">
      <div #speakingAiChat class="speaking-ai-chat">
        <div class="speaking-ai-empty" *ngIf="!reader.getActiveSpeakingChatTurns().length">
          Tap the microphone to speak.
        </div>
        <div
          class="speaking-ai-bubble"
          *ngFor="let turn of reader.getActiveSpeakingChatTurns(); trackBy: reader.trackBySpeakingChatTurnId"
          [class.student]="turn.speaker === 'student'"
          [class.ai]="turn.speaker === 'ai'"
          [class.pending]="turn.pending">
          {{ turn.text }}
        </div>
      </div>
      <button
        #speakingRecordButton
        type="button"
        class="speaking-ai-speak"
        [class.recording]="reader.speakingConversationActive"
        [class.thinking]="reader.speakingResponsePending"
        [style.--voice-aura-scale]="reader.speakingRecordingAuraScale"
        [style.--voice-ring-scale]="reader.speakingRecordingRingScale"
        [style.--voice-aura-opacity]="reader.speakingRecordingAuraOpacity"
        [style.--voice-ring-opacity]="reader.speakingRecordingRingOpacity"
        [style.--voice-glow]="reader.speakingRecordingGlow"
        [style.--voice-outer-glow]="reader.speakingRecordingOuterGlow"
        (click)="reader.toggleSpeakingTurnRecording()"
        [disabled]="reader.checkingSpeakingRuntime || reader.speakingResponsePending"
        [attr.aria-label]="reader.getSpeakingTurnActionLabel()"
        [title]="reader.getSpeakingTurnActionLabel()">
        <img [src]="reader.speakingConversationActive ? 'assets/images/book/stop record.png' : 'assets/images/book/microphone.png'" alt="">
      </button>
    </ng-container>

    <ng-template #speakingSessionHistory>
      <div class="speaking-ai-session-list">
        <div class="speaking-ai-empty" *ngIf="!reader.getFinishedSpeakingSessions(reader.activeSpeakingElement).length">
          No conversations yet.
        </div>
        <div class="speaking-ai-session-row" *ngFor="let session of reader.getFinishedSpeakingSessions(reader.activeSpeakingElement); trackBy: reader.trackBySpeakingSessionId">
          <button
            type="button"
            class="speaking-ai-mini icon"
            (click)="reader.toggleSpeakingSessionPlayback(session)"
            [attr.aria-label]="reader.isSpeakingSessionPlaying(session) ? 'Pause speaking conversation' : 'Play speaking conversation'"
            [title]="reader.isSpeakingSessionPlaying(session) ? 'Pause' : 'Play'">
            <img [src]="reader.isSpeakingSessionPlaying(session) ? 'assets/images/book/pause.png' : 'assets/images/book/play.png'" alt="">
          </button>
          <div class="speaking-ai-session-title">
            <input
              type="text"
              [ngModel]="reader.getSpeakingSessionDraft(session)"
              (ngModelChange)="reader.setSpeakingSessionDraft(session, $event)"
              (focus)="reader.setSpeakingSessionDraft(session, reader.getSpeakingSessionDraft(session))"
              (blur)="reader.renameSpeakingSession(session, reader.getSpeakingSessionDraft(session))"
              (click)="$event.stopPropagation()"
              (keydown.enter)="reader.renameSpeakingSession(session, reader.getSpeakingSessionDraft(session)); $any($event.target).blur()"
              aria-label="Speaking conversation name">
          </div>
          <button type="button" class="speaking-ai-mini icon" (click)="reader.exportSpeakingSession(session)" aria-label="Export speaking conversation" title="Export">
            <img src="assets/images/book/export.png" alt="">
          </button>
          <button type="button" class="speaking-ai-mini danger" (click)="reader.deleteSpeakingSession(session)" aria-label="Delete speaking conversation">
            <img src="assets/images/book/delete.png" alt="">
          </button>
        </div>
      </div>
    </ng-template>
  </div>
</div>
