<div class="activity-page np-page min-h-screen p-6">
  <div class="activity-shell mx-auto w-full max-w-screen-xl">
    <!-- Header with back button -->
    <div class="flex items-center mb-8">
      <button (click)="goBack()"
              class="bg-surface rounded-full p-2 shadow-md hover:shadow-lg transition mr-4"
              [attr.title]="'backToTopics' | translate">
        <svg class="w-6 h-6 text-ink-soft" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1 class="np-title-gradient text-4xl font-extrabold text-transparent bg-clip-text">
        {{ topicName }} – {{ 'activitiesLabel' | translate }}
      </h1>
    </div>

    <!-- Games Grid -->
    <div *ngIf="games.length; else noLinkedActivities" class="game-grid">
      <!-- Game card with conditional behavior for AI game -->
      <div *ngFor="let game of games; let i = index"
           (click)="onGameClick(game)"
           class="game-card np-card np-card-lift relative rounded-2xl overflow-hidden"
           [style.--game-tint]="gameTint(i)"
           [class.opacity-40.2]="selectedGame && selectedGame !== game"
           [class.np-ring-selected]="selectedGame === game"
           [style.z-index]="selectedGame === game && showSettings ? 15 : null">
        <!-- Game Icon -->
        <div class="np-game-header game-card-header">
          <img *ngIf="game.iconImage" [src]="game.iconImage" alt="" class="game-card-icon">
          <span *ngIf="!game.iconImage" class="game-card-emoji">{{ game.icon }}</span>
        </div>

        <!-- Game Info -->
        <div class="game-card-body">
          <h3 class="game-card-title">{{ game.nameKey | translate }}</h3>
          <p class="game-card-desc">{{ game.descKey | translate }}</p>
        </div>

        <!-- Settings indicator (if needed) -->
        <img *ngIf="game.requiresSettings"
             src="assets/images/settings.png"
             class="absolute top-2 right-2 h-5 w-5 object-contain drop-shadow-md"
             [attr.alt]="'settings' | translate"
             [attr.title]="'settings' | translate">
      </div>
    </div>

    <ng-template #noLinkedActivities>
      <div class="empty-activity-state">
        <span aria-hidden="true">&#9888;</span>
        <strong>No activities are linked to this book marker.</strong>
        <button type="button" (click)="goBack()">{{ 'readerBack' | translate }}</button>
      </div>
    </ng-template>

    <!-- Backdrop — clicking outside the panel closes it -->
    <div *ngIf="selectedGame && showSettings"
         class="fixed inset-0 z-10"
         (click)="cancelSelection()">
    </div>

    <!-- Settings Panel (slides in) -->
    <div *ngIf="selectedGame && showSettings"
         class="game-settings-panel bg-surface text-ink z-20"
         role="dialog" aria-modal="true" aria-labelledby="gameSettingsTitle">
      <!-- The game it sets up, in the game's own colour, so the teacher sees what they picked. -->
      <div class="game-settings-head np-game-header" [style.--game-tint]="gameTint(games.indexOf(selectedGame))">
        <img *ngIf="selectedGame.iconImage" [src]="selectedGame.iconImage" alt="" class="game-settings-icon">
        <span *ngIf="!selectedGame.iconImage" class="game-settings-icon game-settings-emoji">{{ selectedGame.icon }}</span>
        <div class="game-settings-heading">
          <span class="game-settings-kicker">{{ 'settings' | translate }}</span>
          <h2 id="gameSettingsTitle">{{ selectedGame.nameKey | translate }}</h2>
        </div>
        <button type="button" (click)="cancelSelection()" class="game-settings-close"
                [attr.title]="'close' | translate" [attr.aria-label]="'close' | translate">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Settings form -->
      <div class="game-settings-body">
        <app-settings-panel
          [gameId]="selectedGame.id"
          [initialValue]="settings"
          (settingsChange)="onSettingsChange($event)"
          (chooseGiftTopic)="chooseGiftTopic()">
        </app-settings-panel>
      </div>

      <!-- Always in reach at the bottom, however long the settings. -->
      <div class="game-settings-foot">
        <button type="button" (click)="cancelSelection()" class="game-settings-cancel">
          {{ 'cancelOption' | translate }}
        </button>
        <button type="button" (click)="startGame()" class="game-settings-start np-btn-go">
          {{ 'startGame' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
