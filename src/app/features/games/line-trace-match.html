<div class="relative h-screen overflow-hidden bg-gradient-to-br from-teal-900 to-cyan-800 p-3 flex flex-col"
     [style.background]="themeActive ? themeBackground : null">
  <div *ngIf="themeActive && themeDim > 0" class="ltm-theme-dim" [style.opacity]="themeDim"></div>

  <div class="np-game-corner">
    <app-game-keyboard-help
      [shortcuts]="keyboardShortcuts"
      (openChange)="keyboardHintsVisible = $event"
      title="Keyboard shortcuts">
    </app-game-keyboard-help>
    <span *ngIf="!loading && !gameFinished" class="np-game-pill">{{ matchedCount }} / {{ pairCount }}</span>
    <app-star-pill *ngIf="!loading && !gameFinished" [count]="cleanCount" [label]="'gameStars' | translate"></app-star-pill>
  </div>

  <h2 class="sr-only">{{ 'gameLineTraceMatchName' | translate }}</h2>


  <button
    *ngIf="!loading && !gameFinished && hasAudioItems"
    type="button"
    (click)="activateSoundQuiz()"
    class="ltm-speaker-btn"
    [class.active]="soundQuizActive"
    [disabled]="allAudioItemsMatched"
    aria-label="Play a sound clue">
    🔊
  </button>

  <!-- Loading -->
  <div *ngIf="loading" class="flex justify-center items-center h-64">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white"></div>
  </div>

  <div *ngIf="!loading && !gameFinished" #board class="board relative flex-1 min-h-0 rounded-2xl">
    <canvas #lineCanvas class="line-canvas"></canvas>

    <button
      *ngFor="let el of elements; trackBy: trackByElementId"
      type="button"
      class="tile"
      [class]="textWrapClass(el)"
      [class.text-tile]="el.kind === 'text'"
      [class.image-tile]="el.kind === 'image'"
      [class.selected]="selectedElementId === el.id"
      [class.matched]="el.matched"
      [class.shake]="el.shake"
      [attr.data-element-id]="el.id"
      [attr.tabindex]="el.matched ? -1 : 0"
      [attr.aria-pressed]="selectedElementId === el.id"
      [attr.aria-label]="el.kind === 'text' ? el.text : ('Picture for ' + el.text)"
      [style.top.%]="el.topPct"
      [style.left.%]="el.leftPct"
      (pointerdown)="onTilePointerDown($event, el)"
      (pointermove)="onTilePointerMove($event)"
      (pointerup)="onTilePointerUp($event)"
      (pointercancel)="onTilePointerCancel($event)"
      (pointerleave)="onTilePointerCancel($event)"
      (keydown)="onTileKeydown($event, el)">
      <span *ngIf="el.kind === 'text'">{{ el.text }}</span>
      <img *ngIf="el.kind === 'image'" [src]="el.imageUrl" alt="">
    </button>
  </div>

  <app-game-finish-overlay
    *ngIf="gameFinished"
    [title]="'lineTraceMatchFinishTitle' | translate"
    [message]="'⭐ ' + ('lineTraceMatchResult' | translate: { count: cleanCount, total: pairCount })"
    (playAgain)="resetGame()"
    (activities)="onMenuAction('activity')">
  </app-game-finish-overlay>

  <app-sandwich-menu (action)="onMenuAction($event)"></app-sandwich-menu>
</div>
