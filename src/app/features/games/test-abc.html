<div class="game-container">
  <app-game-keyboard-help
    class="test-abc-keyboard-help"
    [shortcuts]="keyboardShortcuts"
    (openChange)="keyboardHintsVisible = $event"
    title="Keyboard shortcuts">
  </app-game-keyboard-help>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-overlay">
    <div class="loading-spinner">📝</div>
    <p>{{ 'testAbcLoading' | translate }}</p>
  </div>

  <div *ngIf="!loading && !gameFinished && questions.length" class="quiz-board">
    <!-- Header with score and progress -->
    <div class="quiz-header">
      <div class="score">{{ 'score' | translate }}: {{ score }} / {{ questions.length }}</div>
      <div class="progress">{{ currentIndex + 1 }} / {{ questions.length }}</div>
    </div>

    <!-- Question area -->
 <div class="question-area">
  <div class="question-card" (click)="hasFlipBack && toggleFlip()">
    <!-- Flip card (only when a 2nd AIT type was picked for the flip-side hint) -->
    <ng-container *ngIf="hasFlipBack; else staticFace">
      <div class="flip-card" [class.flipped]="isFlipped">
        <div class="flip-card-front">
          <ng-container *ngTemplateOutlet="aitContent; context: { type: aitQuestionType, item: questions[currentIndex].correctItem }"></ng-container>
        </div>
        <div class="flip-card-back">
          <ng-container *ngTemplateOutlet="aitContent; context: { type: aitBackType, item: questions[currentIndex].correctItem }"></ng-container>
        </div>
      </div>
    </ng-container>
    <ng-template #staticFace>
      <ng-container *ngTemplateOutlet="aitContent; context: { type: aitQuestionType, item: questions[currentIndex].correctItem }"></ng-container>
    </ng-template>

    <!-- Reusable content template -->
    <ng-template #aitContent let-type="type" let-item="item">
      <div *ngIf="type === 'text'" class="question-text">
        <div class="word-display">{{ item?.text || '?' }}</div>
      </div>
      <div *ngIf="type === 'image'" class="question-image">
        <div class="image-display">
          <img *ngIf="item?.image" [src]="imageUrl(item.image, item.id!)" alt="question">
          <span *ngIf="!item?.image" class="word-display">?</span>
        </div>
      </div>
      <div *ngIf="type === 'audio'" class="question-audio">
        <button type="button" class="speaker-icon" [disabled]="!item?.audio" (click)="onAudioFaceClick($event, item)">
          🔊
        </button>
      </div>
    </ng-template>
  </div>
</div>

    <!-- Options grid (3 items) -->
    <div class="options-area">
      <div *ngFor="let opt of questions[currentIndex].options; let optIndex = index; trackBy: trackByOptionId"
           class="option-card"
           [class.selected]="selectedCorrect && opt.id === selectedOptionId"
           [class.keyboard-selected]="isKeyboardOptionSelected(optIndex)"
           [class.disabled]="answeredQuestions.has(currentIndex)"
           [class.fade-out]="fadeOutOptionIds.has(opt.id!)"
           [attr.data-opt-id]="opt.id"
           (click)="onOptionClick(opt)">
        <span *ngIf="keyboardHintsVisible" class="option-number-badge">{{ optIndex + 1 }}</span>
        <div *ngIf="aitOptionsType === 'image'" class="option-image">
          <img *ngIf="opt.image" [src]="imageUrl(opt.image, opt.id!)" alt="option">
          <span *ngIf="!opt.image" class="option-text">?</span>
        </div>
        <div *ngIf="aitOptionsType === 'text'" class="option-text">{{ opt.text || '?' }}</div>
        <div *ngIf="aitOptionsType === 'audio'" class="option-audio">
          <button type="button" class="speaker-icon option-speaker-icon" [disabled]="!opt.audio" (click)="onAudioFaceClick($event, opt)">
            🔊
          </button>
        </div>
      </div>
    </div>

    <!-- Navigation buttons -->
    <div class="nav-buttons">
      <button class="nav-btn prev" (click)="previousQuestion()" [disabled]="currentIndex === 0" aria-label="Previous" title="Previous">
        <span aria-hidden="true">&#9664;</span>
      </button>
      <button class="nav-btn next" (click)="nextQuestion()" [disabled]="currentIndex === questions.length - 1" aria-label="Next" title="Next">
        <span aria-hidden="true">&#9654;</span>
      </button>
    </div>
  </div>

  <app-game-finish-overlay
    *ngIf="gameFinished"
    [title]="'testAbcQuizComplete' | translate"
    [message]="('testAbcYourScore' | translate) + ': ' + score + ' / ' + questions.length"
    (playAgain)="resetGame()"
    (activities)="goToActivities()">
  </app-game-finish-overlay>


  <!-- Sandwich Menu -->
  <app-sandwich-menu (action)="onMenuAction($event)"></app-sandwich-menu>
</div>
