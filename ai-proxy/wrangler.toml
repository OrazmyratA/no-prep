name = "noprep-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Daily clean-up of old usage counters.
[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "noprep-ai-usage"
# Paste the id printed by `npx wrangler d1 create noprep-ai-usage` (see docs/ai-topic-generator.md).
database_id = "PASTE_D1_DATABASE_ID_HERE"

[vars]
# Cheapest vision-capable Gemini model at build time; change here without an app update.
GEMINI_MODEL = "gemini-3.1-flash-lite"
# Silent anti-abuse limits, far above normal classroom use.
MACHINE_HOURLY_LIMIT = "40"
MACHINE_DAILY_LIMIT = "150"
# Safety net against many leaked licenses at once (~$0.004 per topic => ~$80/day worst case).
GLOBAL_DAILY_LIMIT = "20000"
MAX_BODY_BYTES = "12000000"
# Public half of the license key pair (same as native/security-core/src/lib.rs). Safe to publish.
